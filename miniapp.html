<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הפקת שובר | ShimriTouch</title>
    <script>
      (function () {
        var hash = location.hash || "";
        var params = new URLSearchParams(hash.charAt(0) === "#" ? hash.slice(1) : hash);
        var data = params.get("tgWebAppData") || "";
        if (!data) {
          data = new URLSearchParams(location.search).get("tgWebAppData") || "";
        }
        window.__tgInitData = data;
        if (data) {
          try {
            sessionStorage.setItem("tg_init_data", data);
          } catch (err) {}
        }
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" href="assets/images/ShimriTouch.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Suez+One&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#3e4a3d", cream: "#faf8f5", ink: "#2c332b" },
            fontFamily: { sans: ["Heebo", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/voucher.css" />
  </head>
  <body class="voucher-page font-sans text-ink">
    <main class="voucher-shell">
      <section id="form-step" class="miniapp-card">
        <h1 class="mb-3 text-xl font-bold text-primary">יצירת שובר חדש</h1>
        <form id="voucher-form" class="field-grid" novalidate>
          <input name="recipient_name" required placeholder="שם מקבלת השובר" />
          <textarea name="message" rows="4" required placeholder="טקסט ברכה"></textarea>
          <input name="duration" type="number" min="15" max="240" value="60" required placeholder="משך בדקות" />
          <input name="sender_name" required placeholder="שם השולחת / הנותנת" />
          <input name="buyer_phone" type="tel" required placeholder="נייד רוכשת (חובה)" />
          <input name="recipient_phone" type="tel" placeholder="נייד מקבלת (רשות)" />
          <button class="rounded-full bg-primary px-5 py-3 font-semibold text-white" type="submit">המשך לתצוגה מקדימה</button>
          <p id="form-error" class="text-sm text-red-700" role="alert"></p>
        </form>
      </section>
      <section id="preview-step" class="hidden">
        <div id="preview-card"></div>
        <div class="miniapp-actions">
          <button id="issue-btn" class="rounded-full bg-primary px-5 py-3 font-semibold text-white" type="button">הפק שובר רשמית</button>
          <button id="cancel-btn" class="rounded-full bg-red-700 px-5 py-3 font-semibold text-white" type="button">ביטול</button>
        </div>
        <p id="preview-status" class="mt-3 text-sm"></p>
      </section>
    </main>
    <script src="js/voucher-card.js"></script>
    <script src="js/miniapp.js"></script>
  </body>
</html>
