[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@resvg/resvg-js"]
  included_files = ["assets/images/voucher-bg.jpg", "assets/images/ShimriTouch.svg", "netlify/functions/fonts/*.ttf"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/voucher/:code"
  to = "/voucher.html"
  status = 200
